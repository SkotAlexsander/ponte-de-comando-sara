<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":560}}'>

function iniciarCarga(doc, aoTerminar) {
  var raiz = doc.getElementById('cg'); if (!raiz || raiz._rodando) return; raiz._rodando = true;
  var liq = doc.getElementById('cg-liquido'), num = doc.getElementById('cg-num'), barra = doc.getElementById('cg-barra');
  var etapa = doc.getElementById('cg-etapa'), log = doc.getElementById('cg-log'), relogio = doc.getElementById('cg-relogio');
  var onda = doc.getElementById('cg-onda'), ondaSvg = doc.getElementById('cg-onda-svg'), brilho = doc.getElementById('cg-brilho');
  var quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var bolhas = Array.prototype.slice.call(raiz.querySelectorAll('.cg-bolha'));
  bolhas.forEach(function (b) { b.style.animationName = ''; b.style.opacity = ''; });
  // frente do líquido: uma senoide vertical (28 px, a altura do vão), com o mesmo degradê do líquido; anda pelo quadro, não por transform
  function frente(s) {
    var f = quieto ? 0 : (s / 1.2) * 40, d = 'M0 0 ';
    for (var y = 0; y <= 28; y += 1) d += 'L' + (5 + 4.5 * Math.sin((y + f) / 40 * Math.PI * 2)).toFixed(2) + ' ' + y + ' ';
    onda.setAttribute('d', d + 'L0 28 Z');
  }
  // curva da carga: 8,2 s com respiros, como sistema de verdade
  var C = [[0, 0], [0.5, 4], [1.3, 13], [2.0, 19], [2.5, 21], [3.3, 38], [3.9, 44], [4.5, 59], [5.2, 66], [5.9, 79], [6.5, 88], [7.1, 93], [7.6, 97], [8.2, 100]];
  var PASSOS = [
    [0, 'ligando o núcleo da ponte', 'OK'], [9, 'montando as molduras de metal', 'OK'], [20, 'ligando os cabos de moldura a moldura', 'OK'],
    [33, 'conectando ao Claude Code', 'OK'], [47, 'abrindo a pasta de trabalho · A:\\Claude', 'OK'], [58, 'chamando a equipe · 34 funcionários', 'PRONTOS'],
    [71, 'lendo a memória da Sara', 'OK'], [84, 'calibrando o retrato e a voz', 'OK'], [95, 'acendendo as luzes do console', 'OK']
  ];
  var ETAPAS = [[0, 'PONTE DE COMANDO ABRINDO'], [33, 'CONECTANDO'], [58, 'CHAMANDO A EQUIPE'], [84, 'CALIBRANDO A SARA'], [100, 'PONTE DE COMANDO ABERTA']];
  var mostrados = 0, t0 = performance.now(), fim = false;
  var linhas = [];
  function linha(txt, ok) {
    linhas.push('<div>› ' + txt + (ok ? ' <b>' + ok + '</b>' : '') + '</div>');
    if (linhas.length > 5) linhas.shift();
    log.innerHTML = linhas.join('') + '<div>› <span class="cg-cursor"></span></div>';
  }
  function em(s) {
    for (var i = 1; i < C.length; i++) if (s <= C[i][0]) { var a = C[i - 1], b = C[i], k = (s - a[0]) / (b[0] - a[0]); k = k * k * (3 - 2 * k); return a[1] + (b[1] - a[1]) * k; }
    return 100;
  }
  function quadro(agora) {
    var s = (agora - t0) / 1000, p = Math.min(100, em(s)), n = Math.floor(p);
    liq.style.width = p + '%'; brilho.style.width = p + '%'; brilho.style.opacity = p > 1 ? '1' : '0';
    ondaSvg.style.display = p > 3 && p < 99.5 ? 'block' : 'none'; if (p > 3 && p < 99.5) frente(s);
    num.textContent = n; barra.setAttribute('aria-valuenow', String(n));
    while (mostrados < PASSOS.length && n >= PASSOS[mostrados][0]) { linha(PASSOS[mostrados][1], PASSOS[mostrados][2]); mostrados++; }
    for (var j = ETAPAS.length - 1; j >= 0; j--) if (n >= ETAPAS[j][0]) { etapa.textContent = ETAPAS[j][1]; break; }
    var dt = new Date(); relogio.textContent = [dt.getHours(), dt.getMinutes(), dt.getSeconds()].map(function (x) { return String(x).padStart(2, '0'); }).join(':');
    if (n >= 100 && !fim) {
      fim = true; raiz.classList.add('cg-pronto'); linha('ponte de comando aberta', '✓');
      // as bolhas param aos poucos: cada uma termina a subida em que está e não volta
      bolhas.forEach(function (b) { b.addEventListener('animationiteration', function () { b.style.animationName = 'none'; b.style.opacity = '0'; }, { once: true }); });
      setTimeout(function () {
        try { window.dispatchEvent(new Event('carregado')); } catch (e) {}
        try { if (window.parent && window.parent !== window) window.parent.postMessage('carregado', '*'); } catch (e) {}
        if (aoTerminar) aoTerminar();
      }, 600);
      return;
    }
    raiz._raf = requestAnimationFrame(quadro);
  }
  raiz._raf = requestAnimationFrame(quadro);
  return function parar() { cancelAnimationFrame(raiz._raf); raiz._rodando = false; };
}

class Component extends DCLogic {
  componentDidMount() { this._t = setTimeout(() => { this._parar = iniciarCarga(document); }, 150); }
  componentWillUnmount() { clearTimeout(this._t); if (this._parar) this._parar(); }
  renderVals() {
    return {
      deNovo: () => {
        if (this._parar) this._parar();
        const r = document.getElementById('cg'); if (r) { r.classList.remove('cg-pronto'); r._rodando = false; }
        const log = document.getElementById('cg-log'); if (log) log.innerHTML = '';
        this._parar = iniciarCarga(document);
      }
    };
  }
}
</script>
